<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Post Facebook — Fonte musculaire des jambes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{ width:1080px; height:1080px; overflow:hidden; }
  :root{
    --teal:#3B23D4; --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  }
  .frame{ width:1080px; height:1080px; position:relative; background:linear-gradient(168deg,#6653dd,#3B23D4 55%,#2c1aa8); font-family:var(--sans); overflow:hidden; }

  .deco{ position:absolute; top:-140px; right:-140px; width:420px; height:420px; border-radius:50%; border:2px solid rgba(255,255,255,.14); }
  .deco2{ position:absolute; bottom:-160px; left:-160px; width:460px; height:460px; border-radius:50%; border:2px solid rgba(255,255,255,.10); }

  .brandmark{ position:absolute; top:56px; left:56px; width:56px; height:56px;
    -webkit-mask-image:url('../carte-visite-assets/logo-mark.png'); mask-image:url('../carte-visite-assets/logo-mark.png');
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center;
    background-color:#fff; }

  .content{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); padding:0 70px; }
  .eyebrow{ font-weight:800; font-size:26px; letter-spacing:.13em; text-transform:uppercase; color:#ffe9b3; }
  h1{ font-family:var(--serif); font-weight:700; font-size:64px; line-height:1.1; color:#fff; margin-top:16px; }
  .sub{ font-family:var(--sans); font-weight:500; font-size:29px; line-height:1.42; color:rgba(255,255,255,.92); margin-top:22px; max-width:24ch; }

  footer{ position:absolute; left:0; right:0; bottom:56px; padding:0 70px; }
  footer .name{ font-family:var(--serif); font-weight:700; font-size:26px; color:#fff; }
  footer .site{ font-family:var(--sans); font-weight:500; font-size:20px; color:rgba(255,255,255,.72); margin-top:4px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="deco"></div>
    <div class="deco2"></div>
    <div class="brandmark"></div>
    <div class="content">
      <p class="eyebrow">Comprendre &amp; agir</p>
      <h1>Vos jambes s'affaiblissent ?</h1>
      <p class="sub">Le yoga doux peut aider à ralentir la fonte musculaire — à votre rythme.</p>
    </div>
    <footer>
      <p class="name">Cornelia Althaus</p>
      <p class="site">corneliaenseignanteyogaavenches.com</p>
    </footer>
  </div>
</body>
</html>
