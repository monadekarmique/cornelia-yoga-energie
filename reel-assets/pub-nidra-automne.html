<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Publicité — Yoga Nidra d'automne 2026 (le cygne)</title>
<!-- Trois formats, choisis par l'adresse : ?f=carre (1080×1080, Facebook) · ?f=portrait (1080×1350, Instagram) ·
     ?f=story (1080×1920, story Instagram, TikTok). ?s=… remplace la ligne du bas (sous-titre d'une vidéo). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{ --bleu:#3B23D4; --or:#ffe9b3; --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
         --w:1080px; --h:1350px; --marge:76px; --haut:70px; --bas:64px; --titre:74px; --cygne:760px; --cygne-bas:300px; }
  body.carre{ --h:1080px; --titre:62px; --cygne:560px; --cygne-bas:236px; --haut:56px; --bas:52px; }
  body.story{ --h:1920px; --titre:84px; --cygne:900px; --cygne-bas:520px; --haut:270px; --bas:360px; }
  html,body{ width:var(--w); height:var(--h); overflow:hidden; }
  .frame{ width:var(--w); height:var(--h); position:relative; overflow:hidden; font-family:var(--sans);
          background:linear-gradient(168deg,#6653dd,#3B23D4 52%,#2c1aa8); }
  .deco{ position:absolute; top:-150px; right:-150px; width:440px; height:440px; border-radius:50%; border:2px solid rgba(255,255,255,.14); }
  .brandmark{ position:absolute; top:var(--haut); left:var(--marge); width:58px; height:58px;
    -webkit-mask-image:url('../carte-visite-assets/logo-mark.png'); mask-image:url('../carte-visite-assets/logo-mark.png');
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; background-color:#fff; }
  .texte{ position:absolute; left:var(--marge); right:var(--marge); top:calc(var(--haut) + 96px); }
  .eyebrow{ font-weight:800; font-size:27px; letter-spacing:.13em; text-transform:uppercase; color:var(--or); }
  h1{ font-family:var(--serif); font-weight:700; font-size:var(--titre); line-height:1.08; color:#fff; margin-top:18px; }
  h1 em{ font-style:italic; font-weight:500; color:var(--or); }
  .sub{ font-weight:500; font-size:31px; line-height:1.4; color:rgba(255,255,255,.92); margin-top:22px; max-width:26ch; }
  .cygne{ position:absolute; left:50%; bottom:var(--cygne-bas); width:var(--cygne); transform:translateX(-46%); }
  .cygne svg{ display:block; width:100%; height:auto; overflow:visible; }
  .bas{ position:absolute; left:var(--marge); right:var(--marge); bottom:var(--bas); }
  .pastille{ display:inline-block; background:#fff; color:var(--bleu); font-weight:800; font-size:29px; letter-spacing:.01em;
             padding:16px 30px; border-radius:999px; }
  .pastille span{ font-weight:600; opacity:.8 }
  .soustitre{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:46px; line-height:1.25; color:#fff; min-height:2.5em; }
  .signature{ margin-top:26px; display:flex; justify-content:space-between; align-items:baseline; gap:20px; }
  .signature .name{ font-family:var(--serif); font-weight:700; font-size:27px; color:#fff; }
  .signature .site{ font-weight:500; font-size:20px; color:rgba(255,255,255,.74); }
  body.carre .sub{ display:none }
</style>
</head>
<body>
  <div class="frame">
    <div class="deco"></div>
    <div class="brandmark"></div>
    <div class="texte">
      <p class="eyebrow">Yoga Nidra d’automne 2026</p>
      <h1>Le corps s’endort, l’esprit veille <em>comme le cygne.</em></h1>
      <p class="sub">Une séance guidée par ma voix, 51 minutes, à écouter chez toi.</p>
    </div>
    <div class="cygne">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" aria-hidden="true">
        <defs>
          <g id="cygne">
            <path d="M152 236 C140 204 176 172 236 170 C292 168 338 150 380 118 C378 168 360 214 322 236 C274 250 196 250 152 236 Z" fill="#fff"/>
            <path d="M176 222 C140 196 128 150 150 112 C166 84 178 62 158 46 C138 32 114 46 110 72" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
            <ellipse cx="109" cy="78" rx="14" ry="11.5" transform="rotate(-38 109 78)" fill="#fff"/>
            <path d="M99 80 L78 108 L112 91 Z" fill="#ffe9b3"/>
          </g>
          <linearGradient id="fondu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <mask id="reflet"><rect x="0" y="244" width="440" height="90" fill="url(#fondu)"/></mask>
        </defs>
        <g mask="url(#reflet)" opacity=".2"><g transform="translate(0,488) scale(1,-1)"><use href="#cygne"/></g></g>
        <use href="#cygne"/>
        <path d="M214 196 C252 178 304 176 352 150" fill="none" stroke="#3B23D4" stroke-width="3" stroke-linecap="round" opacity=".45"/>
        <path d="M232 216 C266 204 306 202 344 184" fill="none" stroke="#3B23D4" stroke-width="3" stroke-linecap="round" opacity=".3"/>
        <path d="M108 77 q5 4 10 0" fill="none" stroke="#3B23D4" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M18 244 H422" stroke="#fff" stroke-width="2" opacity=".45" stroke-linecap="round"/>
        <path d="M60 262 H150 M250 268 H372 M120 284 H210" stroke="#fff" stroke-width="2" opacity=".2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="bas">
      <div id="ligne"><span class="pastille">Écoute 25 secondes <span>· séance complète CHF 40</span></span></div>
      <div class="signature"><p class="name">Cornelia Althaus</p><p class="site">corneliaenseignanteyogaavenches.com</p></div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.body.className = q.get("f") || "portrait";
    if (q.get("s") !== null) document.getElementById("ligne").innerHTML = '<p class="soustitre"></p>', document.querySelector(".soustitre").textContent = q.get("s");
  </script>
</body>
</html>
