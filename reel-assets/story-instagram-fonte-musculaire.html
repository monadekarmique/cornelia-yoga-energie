<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Story Instagram — Fonte musculaire des jambes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{ width:1080px; height:1920px; overflow:hidden; }
  :root{
    --teal:#3B23D4; --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  }
  .frame{ width:1080px; height:1920px; position:relative; background:linear-gradient(168deg,#6653dd,#3B23D4 55%,#2c1aa8); font-family:var(--sans); overflow:hidden; }

  .deco{ position:absolute; top:-180px; right:-180px; width:560px; height:560px; border-radius:50%; border:2px solid rgba(255,255,255,.14); }
  .deco2{ position:absolute; bottom:-220px; left:-220px; width:620px; height:620px; border-radius:50%; border:2px solid rgba(255,255,255,.10); }

  .brandmark{ position:absolute; top:96px; left:64px; width:70px; height:70px;
    -webkit-mask-image:url('../carte-visite-assets/logo-mark.png'); mask-image:url('../carte-visite-assets/logo-mark.png');
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center;
    background-color:#fff; }

  .content{ position:absolute; left:0; right:0; top:44%; transform:translateY(-50%); padding:0 84px; }
  .eyebrow{ font-weight:800; font-size:34px; letter-spacing:.14em; text-transform:uppercase; color:#ffe9b3; }
  h1{ font-family:var(--serif); font-weight:700; font-size:88px; line-height:1.08; color:#fff; margin-top:22px; }
  .sub{ font-family:var(--sans); font-weight:500; font-size:38px; line-height:1.42; color:rgba(255,255,255,.92); margin-top:30px; max-width:22ch; }
  .chips{ margin-top:38px; display:flex; flex-direction:column; gap:14px; }
  .chip{ display:inline-flex; align-items:baseline; gap:12px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); border-radius:16px; padding:16px 26px; width:fit-content; }
  .chip b{ font-family:var(--sans); font-weight:800; font-size:30px; color:#fff; }
  .chip span{ font-family:var(--sans); font-weight:500; font-size:26px; color:rgba(255,255,255,.82); }

  .cta{ position:absolute; left:0; right:0; bottom:230px; padding:0 84px; display:flex; justify-content:center; }
  .cta .lien{ display:inline-flex; align-items:center; gap:14px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); border-radius:999px; padding:20px 40px; }
  .cta .lien svg{ width:32px; height:32px; }
  .cta .lien span{ font-family:var(--sans); font-weight:800; font-size:30px; color:#fff; }

  footer{ position:absolute; left:0; right:0; bottom:96px; padding:0 84px; text-align:center; }
  footer .name{ font-family:var(--serif); font-weight:700; font-size:34px; color:#fff; }
  footer .site{ font-family:var(--sans); font-weight:500; font-size:26px; color:rgba(255,255,255,.72); margin-top:6px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="deco"></div>
    <div class="deco2"></div>
    <div class="brandmark"></div>
    <div class="content">
      <p class="eyebrow">Comprendre &amp; agir</p>
      <h1>Vos jambes<br>s'affaiblissent ?</h1>
      <p class="sub">Le yoga doux peut aider à ralentir la fonte musculaire — à votre rythme.</p>
      <div class="chips">
        <div class="chip"><b>🗓 Mercredi · 9h30–11h00</b><span>Morat</span></div>
        <div class="chip"><b>🗓 Mercredi · 17h30–19h00</b><span>Avenches</span></div>
      </div>
    </div>
    <div class="cta">
      <div class="lien">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7-7 7 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Lien en story</span>
      </div>
    </div>
    <footer>
      <p class="name">Cornelia Althaus</p>
      <p class="site">corneliaenseignanteyogaavenches.com</p>
    </footer>
  </div>
</body>
</html>
