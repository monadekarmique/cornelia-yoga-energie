<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Statut WhatsApp — Yoga Maternité</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{ width:1080px; height:1920px; overflow:hidden; }
  :root{
    --teal:#3B23D4; --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  }
  .frame{ width:1080px; height:1920px; position:relative; background:linear-gradient(168deg,#6653dd,#3B23D4 55%,#2c1aa8); font-family:var(--sans); overflow:hidden; }

  /* touche décorative douce, cohérente avec le logo (cercle + pétales), sans surcharger */
  .deco{ position:absolute; top:-180px; right:-180px; width:560px; height:560px; border-radius:50%; border:2px solid rgba(255,255,255,.14); }
  .deco2{ position:absolute; bottom:-220px; left:-220px; width:620px; height:620px; border-radius:50%; border:2px solid rgba(255,255,255,.10); }

  .brandmark{ position:absolute; top:96px; left:64px; width:70px; height:70px;
    -webkit-mask-image:url('../carte-visite-assets/logo-mark.png'); mask-image:url('../carte-visite-assets/logo-mark.png');
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center;
    background-color:#fff; }

  .content{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); padding:0 84px; }
  .eyebrow{ font-weight:800; font-size:34px; letter-spacing:.14em; text-transform:uppercase; color:#ffe9b3; }
  h1{ font-family:var(--serif); font-weight:700; font-size:118px; line-height:1.04; color:#fff; margin-top:22px; }
  .sub{ font-family:var(--sans); font-weight:500; font-size:42px; line-height:1.48; color:rgba(255,255,255,.92); margin-top:34px; max-width:19ch; }
  .when{ margin-top:36px; display:inline-block; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); border-radius:999px; padding:16px 32px; }
  .when span{ font-family:var(--sans); font-weight:700; font-size:32px; color:#fff; }

  .cta{ position:absolute; left:0; right:0; bottom:220px; padding:0 84px; }
  .cta .msg{ display:inline-flex; align-items:center; gap:16px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); border-radius:999px; padding:22px 40px; }
  .cta .msg svg{ width:44px; height:44px; flex-shrink:0; }
  .cta .msg span{ font-family:var(--sans); font-weight:800; font-size:38px; color:#fff; }

  footer{ position:absolute; left:0; right:0; bottom:96px; padding:0 84px; }
  footer .name{ font-family:var(--serif); font-weight:700; font-size:34px; color:#fff; }
  footer .site{ font-family:var(--sans); font-weight:500; font-size:26px; color:rgba(255,255,255,.72); margin-top:6px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="deco"></div>
    <div class="deco2"></div>
    <div class="brandmark"></div>
    <div class="content">
      <p class="eyebrow">Chaque mardi — Morat</p>
      <h1>Yoga<br>Maternité</h1>
      <p class="sub">Respiration, mobilité,<br>préparation en douceur<br>à la naissance.</p>
      <p class="when"><span>🗓 Mardi · 17h30–19h00 · Atelier Turmalin</span></p>
    </div>
    <div class="cta">
      <div class="msg">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 00-7.7 13.6L3 21l4.5-1.2A9 9 0 1012 3z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Écris-moi</span>
      </div>
    </div>
    <footer>
      <p class="name">Cornelia Althaus</p>
      <p class="site">corneliaenseignanteyogaavenches.com</p>
    </footer>
  </div>
</body>
</html>
